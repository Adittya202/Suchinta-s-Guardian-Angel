<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Credits</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: radial-gradient(circle at center, #2e1065 0%, #1a0833 65%, #0e031c 100%);
      background-color: #1a0833;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
      overflow-x: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 3rem 1.25rem 2.5rem;
    }

    .back-btn {
      position: fixed;
      top: 20px;
      left: 24px;
      z-index: 20;
      color: rgba(255, 255, 255, 0.9);
      text-decoration: none;
      font-size: 0.92rem;
      font-weight: 500;
      padding: 0.5rem 1.15rem;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(216, 180, 254, 0.3);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      transition: all 0.2s ease;
    }

    .back-btn:hover {
      background: rgba(255, 255, 255, 0.24);
      color: #ffffff;
      transform: translateX(-3px);
      box-shadow: 0 4px 15px rgba(168, 85, 247, 0.3);
    }

    /* Photos Stage: Side by Side */
    .photos-stage {
      display: flex;
      flex-direction: row;
      justify-content: center;
      align-items: center;
      gap: 2.2rem;
      width: 100%;
      max-width: 1100px;
      margin: 1rem auto 1.8rem;
    }

    /* Identical photo frame for both pictures */
    .photo-frame {
      flex: 0 1 auto;
      width: clamp(260px, 40vw, 440px);
      height: clamp(340px, 70vh, 580px);
      border-radius: 22px;
      overflow: hidden;
      position: relative;
      background: rgba(22, 8, 42, 0.7);
      box-shadow:
        0 25px 65px rgba(0, 0, 0, 0.7),
        0 0 40px rgba(168, 85, 247, 0.22);
      border: 2px solid rgba(192, 132, 252, 0.32);
      display: flex;
      justify-content: center;
      align-items: center;
      transition: transform 0.35s ease, border-color 0.35s ease, box-shadow 0.35s ease;
      cursor: pointer;
    }

    .photo-frame:hover {
      transform: translateY(-4px) scale(1.015);
      border-color: rgba(216, 180, 254, 0.6);
      box-shadow:
        0 30px 80px rgba(0, 0, 0, 0.8),
        0 0 55px rgba(192, 132, 252, 0.35);
    }

    /* Image fills the identical frame completely and uniformly */
    .photo-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
      display: block;
      transition: transform 0.4s ease, object-fit 0.3s ease;
      user-select: none;
    }

    .photo-frame:hover img {
      transform: scale(1.025);
    }

    /* When clicked to toggle uncropped fit */
    .photo-frame.is-contained img {
      object-fit: contain;
      transform: none;
    }

    /* Copyright & Authority Claim Segment */
    .copyright-segment {
      width: 100%;
      max-width: 820px;
      margin: 0.5rem auto 0;
      text-align: center;
      padding: 1.2rem 1.8rem;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(216, 180, 254, 0.22);
      border-radius: 18px;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.45);
    }

    .copyright-line-1 {
      font-size: clamp(0.95rem, 2.2vw, 1.1rem);
      font-weight: 500;
      color: #ffffff;
      line-height: 1.5;
      letter-spacing: 0.01em;
    }

    .copyright-line-1 strong {
      color: #fde047;
      font-weight: 700;
    }

    .copyright-symbol {
      display: inline-block;
      font-size: 1.15em;
      margin-right: 0.2rem;
      color: #fde047;
    }

    .copyright-line-2 {
      font-size: clamp(0.85rem, 2vw, 0.95rem);
      color: rgba(216, 180, 254, 0.85);
      margin-top: 0.45rem;
      line-height: 1.5;
    }

    @media (max-width: 768px) {
      body {
        padding: 5rem 1rem 2.5rem;
        justify-content: flex-start;
      }

      .photos-stage {
        flex-direction: column;
        gap: 1.8rem;
        margin-top: 0.5rem;
      }

      .photo-frame {
        width: min(92vw, 420px);
        height: min(65vh, 480px);
      }

      .copyright-segment {
        padding: 1.1rem 1.2rem;
      }
    }
  </style>
</head>

<body>

  <a href="index.html" class="back-btn">← Back</a>

  <main class="photos-stage">
    <!-- Picture 1 -->
    <div class="photo-frame" title="Click to toggle fit" tabindex="0" role="button" aria-label="Photo 1">
      <img src="resources/photo.jpg" alt="Mehzabin Suchinta"
        onerror="if(this.src.indexOf('photo1.jpg')===-1) this.src='resources/photo1.jpg';">
    </div>

    <!-- Picture 2 -->
    <div class="photo-frame" title="Click to toggle fit" tabindex="0" role="button" aria-label="Photo 2">
      <img src="resources/photo2.jpg" alt="Adittya Dey">
    </div>
  </main>

  <!-- Copyright Claim & Authority Section -->
  <footer class="copyright-segment">
    <p class="copyright-line-1">
      <span class="copyright-symbol">©</span> 2026 <strong>Adittya Dey</strong>. All rights reserved.
    </p>
    <p class="copyright-line-2">
      Only Adittya and Mehzabin Suchinta can modify, change and are the authors to remove the application.
    </p>
  </footer>

  <script>
    // Click on either photo frame to toggle between flush cover and full contain view
    document.querySelectorAll('.photo-frame').forEach(frame => {
      frame.addEventListener('click', () => {
        frame.classList.toggle('is-contained');
      });

      frame.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          frame.classList.toggle('is-contained');
        }
      });
    });
  </script>

</body>

</html>
